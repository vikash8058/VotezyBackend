<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votezy AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Chatbot Button */
        #chatbot-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.3);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        #chatbot-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(79, 70, 229, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 25px;
            height: 25px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Chatbot Popup */
        #chatbot-popup {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            z-index: 999;
            transform: scale(0) translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow: hidden;
        }

        #chatbot-popup.active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Header */
        .chatbot-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: between;
            position: relative;
        }

        .chatbot-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        .chatbot-title h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .chatbot-title .status {
            font-size: 12px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        #chatbot-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #chatbot-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        /* Messages Container */
        #chatbot-messages {
            height: 440px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
            scroll-behavior: smooth;
        }

        #chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        #chatbot-messages::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        #chatbot-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            color: white;
        }

        .message.user .message-avatar {
            background: #e2e8f0;
            order: 1;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.bot .message-content {
            background: white;
            color: #334155;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-content {
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            color: white;
            margin-left: auto;
            order: 1;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        /* Welcome Message Styling */
        .welcome-message {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .feature-list {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-list li:before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        /* Quick Actions */
        .quick-actions {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-action {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 12px;
            color: #475569;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .quick-action:hover {
            background: #4f46e5;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 16px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                background: #cbd5e1;
            }
            30% {
                transform: translateY(-10px);
                background: #4f46e5;
            }
        }

        /* Input Area */
        .chatbot-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #chatbot-input {
            flex-grow: 1;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            padding: 12px 16px;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 80px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        #chatbot-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        #chatbot-send {
            background: linear-gradient(45deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 18px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        #chatbot-send:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        #chatbot-send:active {
            transform: scale(0.95);
        }

        /* Code styling */
        code {
            background: #f1f5f9;
            color: #7c3aed;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            #chatbot-popup {
                width: 95%;
                height: 85%;
                right: 2.5%;
                bottom: 100px;
            }
            
            #chatbot-btn {
                width: 60px;
                height: 60px;
                bottom: 20px;
                right: 20px;
                font-size: 24px;
            }
            
            .message-content {
                font-size: 13px;
                max-width: 85%;
            }
        }

        /* Enhanced animations */
        .message.bot .message-content {
            animation: slideInLeft 0.5s ease;
        }

        .message.user .message-content {
            animation: slideInRight 0.5s ease;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <!-- Chatbot Button -->
    <button id="chatbot-btn">
        🤖
        <span class="notification-badge">!</span>
    </button>

    <!-- Chatbot Popup -->
    <div id="chatbot-popup">
        <div class="chatbot-header">
            <div class="chatbot-title">
                <div>
                    <h3>🗳️ Votezy AI Assistant</h3>
                    <div class="status">
                        <span class="status-dot"></span>
                        Online
                    </div>
                </div>
            </div>
            <button id="chatbot-close">&times;</button>
        </div>
        
        <div id="chatbot-messages"></div>
        
        <div class="chatbot-input-area">
            <textarea id="chatbot-input" placeholder="Type your question about voting, registration, or elections..." rows="1"></textarea>
            <button id="chatbot-send">➤</button>
        </div>
    </div>

    <script>
        class VotezyAI {
            constructor() {
                this.isOpen = false;
                this.isTyping = false;
                this.conversationHistory = [];
                this.userRole = this.getUserRole();
                this.userName = this.getUserName();
                
                // Knowledge base for intelligent responses
                this.knowledgeBase = {
                    voting: {
                        howToVote: "To cast your vote on Votezy: 1) Login to your voter account 2) Browse available candidates 3) Select your preferred candidate 4) Confirm your vote 5) You'll receive a confirmation receipt",
                        eligibility: "To vote, you must be: 1) 18+ years old 2) Registered as a voter 3) Have completed your profile 4) Haven't voted yet in the current election",
                        security: "Votezy uses advanced encryption, Aadhaar-based verification, and secure protocols to ensure your vote remains private and tamper-proof"
                    },
                    registration: {
                        voter: "Voter Registration: 1) Visit Votezy platform 2) Click 'Register as Voter' 3) Provide full name, username, password 4) Verify your identity 5) Complete your profile",
                        candidate: "Candidate Registration: 1) Visit Votezy platform 2) Click 'Register as Candidate' 3) Provide full name, username, password 4) Complete profile with party name and symbol 5) Wait for admin approval",
                        documents: "Required documents: Aadhaar card, valid email, phone number for OTP verification"
                    },
                    results: {
                        when: "Election results are declared by the admin after voting period ends. You can check the results section once declared.",
                        viewing: "To view results: 1) Go to Results section 2) View candidate standings 3) See vote counts and percentages 4) Check winner announcement"
                    },
                    technical: {
                        login: "Login Issues: 1) Check username/password 2) Ensure caps lock is off 3) Try password reset 4) Contact support if issues persist",
                        voting_status: "Check your voting status in your profile dashboard - it shows if you've already voted",
                        profile: "Complete your profile: 1) Login to your account 2) Go to Profile section 3) Fill all required fields 4) Save changes"
                    }
                };

                this.quickActions = [
                    "How to vote?",
                    "Registration help",
                    "Check voting status", 
                    "View candidates",
                    "Election results",
                    "Technical support",
                    "Account help",
                    "About Votezy"
                ];

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.showWelcomeMessage();
                this.removeNotificationAfterDelay();
            }

            setupEventListeners() {
                const chatbotBtn = document.getElementById('chatbot-btn');
                const chatbotClose = document.getElementById('chatbot-close');
                const chatbotSend = document.getElementById('chatbot-send');
                const chatbotInput = document.getElementById('chatbot-input');

                chatbotBtn.addEventListener('click', () => this.toggleChat());
                chatbotClose.addEventListener('click', () => this.closeChat());
                chatbotSend.addEventListener('click', () => this.sendMessage());
                
                chatbotInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-resize textarea
                chatbotInput.addEventListener('input', (e) => {
                    e.target.style.height = 'auto';
                    e.target.style.height = Math.min(e.target.scrollHeight, 80) + 'px';
                });

                // Close on outside click
                document.addEventListener('click', (e) => {
                    const popup = document.getElementById('chatbot-popup');
                    const btn = document.getElementById('chatbot-btn');
                    
                    if (this.isOpen && !popup.contains(e.target) && !btn.contains(e.target)) {
                        this.closeChat();
                    }
                });
            }

            getUserRole() {
                // Try to get from URL params or default to GUEST
                return new URLSearchParams(window.location.search).get('role') || 'GUEST';
            }

            getUserName() {
                return new URLSearchParams(window.location.search).get('user') || 'User';
            }

            removeNotificationAfterDelay() {
                setTimeout(() => {
                    const badge = document.querySelector('.notification-badge');
                    if (badge) {
                        badge.style.display = 'none';
                    }
                }, 10000); // Remove after 10 seconds
            }

            toggleChat() {
                if (this.isOpen) {
                    this.closeChat();
                } else {
                    this.openChat();
                }
            }

            openChat() {
                const popup = document.getElementById('chatbot-popup');
                const badge = document.querySelector('.notification-badge');
                
                popup.classList.add('active');
                this.isOpen = true;
                
                if (badge) badge.style.display = 'none';
                
                setTimeout(() => {
                    document.getElementById('chatbot-input').focus();
                }, 300);
            }

            closeChat() {
                const popup = document.getElementById('chatbot-popup');
                popup.classList.remove('active');
                this.isOpen = false;
            }

            showWelcomeMessage() {
                setTimeout(() => {
                    const welcomeMsg = `
                        <div class="welcome-message">
                            🗳️ Welcome to Votezy AI Assistant!
                        </div>
                        <p>Hello ${this.userName}! I'm your intelligent voting companion. I can help you with:</p>
                        <ul class="feature-list">
                            <li>Voter & Candidate Registration</li>
                            <li>How to Cast Your Vote</li>
                            <li>Check Voting Status & Results</li>
                            <li>Technical Support & Troubleshooting</li>
                            <li>Election Information & Guidelines</li>
                            <li>Account Management</li>
                        </ul>
                        <p>What would you like to know about? Just ask me anything!</p>
                    `;
                    
                    this.addBotMessage(welcomeMsg, true);
                }, 1000);
            }

            async sendMessage() {
                const input = document.getElementById('chatbot-input');
                const message = input.value.trim();
                
                if (!message || this.isTyping) return;

                this.addUserMessage(message);
                input.value = '';
                input.style.height = 'auto';

                // Show typing indicator
                this.showTypingIndicator();
                
                // Simulate processing delay for more realistic feel
                setTimeout(async () => {
                    const response = await this.generateResponse(message);
                    this.hideTypingIndicator();
                    this.addBotMessage(response);
                }, 800 + Math.random() * 1000);
            }

            addUserMessage(message) {
                const messagesContainer = document.getElementById('chatbot-messages');
                const messageElement = document.createElement('div');
                messageElement.className = 'message user';
                
                messageElement.innerHTML = `
                    <div class="message-avatar">👤</div>
                    <div class="message-content">${this.escapeHtml(message)}</div>
                `;
                
                messagesContainer.appendChild(messageElement);
                this.scrollToBottom();
                this.conversationHistory.push({ role: 'user', message });
            }

            addBotMessage(message, showQuickActions = false) {
                const messagesContainer = document.getElementById('chatbot-messages');
                const messageElement = document.createElement('div');
                messageElement.className = 'message bot';
                
                messageElement.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        ${message}
                        ${showQuickActions ? this.generateQuickActions() : ''}
                    </div>
                `;
                
                messagesContainer.appendChild(messageElement);
                this.scrollToBottom();
                this.conversationHistory.push({ role: 'bot', message });

                // Add click listeners for quick actions
                if (showQuickActions) {
                    this.attachQuickActionListeners(messageElement);
                }
            }

            generateQuickActions() {
                const actions = this.quickActions.slice(0, 4); // Show first 4
                return `
                    <div class="quick-actions">
                        ${actions.map(action => `<button class="quick-action" data-action="${action}">${action}</button>`).join('')}
                    </div>
                `;
            }

            attachQuickActionListeners(messageElement) {
                const quickActions = messageElement.querySelectorAll('.quick-action');
                quickActions.forEach(button => {
                    button.addEventListener('click', () => {
                        const action = button.getAttribute('data-action');
                        this.handleQuickAction(action);
                    });
                });
            }

            handleQuickAction(action) {
                document.getElementById('chatbot-input').value = action;
                this.sendMessage();
            }

            showTypingIndicator() {
                const messagesContainer = document.getElementById('chatbot-messages');
                const typingElement = document.createElement('div');
                typingElement.className = 'message bot typing';
                typingElement.id = 'typing-indicator';
                
                typingElement.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="typing-indicator">
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                `;
                
                messagesContainer.appendChild(typingElement);
                this.scrollToBottom();
                this.isTyping = true;
            }

            hideTypingIndicator() {
                const typingElement = document.getElementById('typing-indicator');
                if (typingElement) {
                    typingElement.remove();
                }
                this.isTyping = false;
            }

            async generateResponse(userMessage) {
                const message = userMessage.toLowerCase();
                
                // Intent detection and response generation
                if (this.matchesIntent(message, ['vote', 'voting', 'cast vote', 'how to vote'])) {
                    return this.getVotingHelp();
                }
                
                if (this.matchesIntent(message, ['register', 'registration', 'sign up', 'create account'])) {
                    return this.getRegistrationHelp();
                }
                
                if (this.matchesIntent(message, ['candidate', 'candidates', 'who can i vote'])) {
                    return this.getCandidateInfo();
                }
                
                if (this.matchesIntent(message, ['result', 'results', 'winner', 'who won'])) {
                    return this.getResultsInfo();
                }
                
                if (this.matchesIntent(message, ['status', 'voted', 'check', 'have i voted'])) {
                    return this.getStatusCheck();
                }
                
                if (this.matchesIntent(message, ['login', 'password', 'forgot', 'access'])) {
                    return this.getLoginHelp();
                }
                
                if (this.matchesIntent(message, ['profile', 'account', 'update', 'change'])) {
                    return this.getProfileHelp();
                }
                
                if (this.matchesIntent(message, ['about', 'votezy', 'platform', 'what is'])) {
                    return this.getAboutInfo();
                }
                
                if (this.matchesIntent(message, ['security', 'safe', 'privacy', 'secure'])) {
                    return this.getSecurityInfo();
                }
                
                if (this.matchesIntent(message, ['help', 'support', 'contact', 'assistance'])) {
                    return this.getGeneralHelp();
                }
                
                if (this.matchesIntent(message, ['hello', 'hi', 'hey', 'greetings'])) {
                    return this.getGreeting();
                }
                
                if (this.matchesIntent(message, ['thank', 'thanks', 'bye', 'goodbye'])) {
                    return this.getThankYouResponse();
                }
                
                // Default response for unmatched queries
                return this.getDefaultResponse(message);
            }

            matchesIntent(message, keywords) {
                return keywords.some(keyword => message.includes(keyword));
            }

            getVotingHelp() {
                if (this.userRole === 'VOTER') {
                    return `
                        <strong>🗳️ How to Cast Your Vote on Votezy:</strong><br><br>
                        <strong>Step-by-step process:</strong><br>
                        1. <strong>Login</strong> to your voter account<br>
                        2. <strong>Browse candidates</strong> - view their profiles and party details<br>
                        3. <strong>Select your choice</strong> - click on your preferred candidate<br>
                        4. <strong>Confirm your vote</strong> - review and submit<br>
                        5. <strong>Get confirmation</strong> - you'll receive a receipt<br><br>
                        <strong>Important:</strong> You can only vote once per election. Make sure you've reviewed all candidates before making your final choice.<br><br>
                        Need help with login or technical issues? Just ask!
                    `;
                } else if (this.userRole === 'CANDIDATE') {
                    return `
                        <strong>📊 Voting Information for Candidates:</strong><br><br>
                        As a candidate, you can:<br>
                        • <strong>View your vote count</strong> in your dashboard<br>
                        • <strong>Check your ranking</strong> against other candidates<br>
                        • <strong>Monitor election progress</strong><br>
                        • <strong>View results</strong> once declared by admin<br><br>
                        Remember: Candidates cannot cast votes in the same election they're participating in.<br><br>
                        Want to know about your current standings or profile completion?
                    `;
                } else {
                    return `
                        <strong>🗳️ Voting on Votezy Platform:</strong><br><br>
                        To participate in elections, you need to:<br>
                        1. <strong>Register as a Voter</strong><br>
                        2. <strong>Complete your profile</strong><br>
                        3. <strong>Verify your identity</strong><br>
                        4. <strong>Wait for election to start</strong><br><br>
                        <strong>Voting Process:</strong><br>
                        • Login to your account<br>
                        • Browse available candidates<br>
                        • Select and confirm your choice<br>
                        • Receive voting confirmation<br><br>
                        Ready to register? Click the "Register" button on the homepage!
                    `;
                }
            }

            getRegistrationHelp() {
                return `
                    <strong>📝 Registration Help:</strong><br><br>
                    
                    <strong>🗳️ Voter Registration:</strong><br>
                    1. Click <strong>"Voter"</strong> on the homepage<br>
                    2. Fill in: Full Name, Username, Password<br>
